version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: levelup-auth-db
    environment:
      POSTGRES_DB: levelup_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d levelup_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: